name: Kurshistorie holen

# Holt einmal pro Woche die komplette Kurshistorie fürs Training des Analyse-Modells
# und legt sie im Branch history-data ab (immer nur ein Commit, damit das Repo klein bleibt).
on:
  schedule:
    - cron: "17 3 * * 0"   # sonntags früh
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_history.py
      - .github/workflows/history.yml

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: true

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Historie holen
        working-directory: scripts
        run: python fetch_history.py --out ../history.json.gz

      - name: Im Branch history-data speichern
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out && mv history.json.gz out/
          cd out
          git init -q -b history-data
          git config user.name "kurswerk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json.gz
          git commit -q -m "Kurshistorie $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" history-data
