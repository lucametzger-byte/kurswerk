name: Kurse aktualisieren

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten (GitHub startet oft ein paar Minuten später)
  workflow_dispatch:          # manuell starten: Actions > Kurse aktualisieren > Run workflow
  push:
    branches: [main]

permissions:
  contents: write   # der Master-Bot speichert seinen Stand im Branch bot-state
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Kurse und News holen
        run: python scripts/fetch_data.py --out site/data/market.json

      - name: Master-Bot-Stand laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" bot-state >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch bot-state "$REMOTE" state
          else
            mkdir state && git -C state init -q -b bot-state && git -C state remote add origin "$REMOTE"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Master-Bot handeln lassen
        run: node scripts/bot.mjs --data site/data/market.json --state state/bot.json --out site/data/bot.json

      - name: Master-Bot-Stand speichern
        run: |
          cd state
          git config user.name "kurswerk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Master-Bot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin bot-state
          fi

      - name: Seite zusammenstellen
        run: cp index.html bt.js site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
